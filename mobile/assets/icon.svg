<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient: Deep Obsidian Black -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141A"/>
      <stop offset="40%" stop-color="#0A0A0E"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Subtle Fiery Rim & Chamfer Lighting for iOS Squircle -->
    <linearGradient id="fieryRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4757" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#FF7F50" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FFA502" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF4757" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Solar Flame Ambient Core Radial Glow -->
    <radialGradient id="solarAmbientGlow" cx="50%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#FFA502" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#FF7F50" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#FF4757" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A0A0E" stop-opacity="0"/>
    </radialGradient>

    <!-- Calorie Progress Ring Gradient: Molten Gold to Solar Tangerine to Fiery Coral Red -->
    <linearGradient id="solarRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA502"/>
      <stop offset="30%" stop-color="#FF921E"/>
      <stop offset="65%" stop-color="#FF7F50"/>
      <stop offset="100%" stop-color="#FF4757"/>
    </linearGradient>

    <!-- Secondary Dial Bezel Gradient -->
    <linearGradient id="dialBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1518"/>
      <stop offset="50%" stop-color="#1A1520"/>
      <stop offset="100%" stop-color="#120D14"/>
    </linearGradient>

    <!-- Outer Flame Primary Gradient (Fiery Coral into Molten Gold) -->
    <linearGradient id="flameOuterGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D63031"/>
      <stop offset="25%" stop-color="#FF4757"/>
      <stop offset="65%" stop-color="#FF7F50"/>
      <stop offset="100%" stop-color="#FFA502"/>
    </linearGradient>

    <!-- Mid Flame Kinetic Energy Gradient -->
    <linearGradient id="flameMidGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4757"/>
      <stop offset="45%" stop-color="#FF7F50"/>
      <stop offset="85%" stop-color="#FFA502"/>
      <stop offset="100%" stop-color="#FFEAA7"/>
    </linearGradient>

    <!-- Core Molten Plasma Gradient -->
    <linearGradient id="flameCoreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFA502"/>
      <stop offset="45%" stop-color="#FFD166"/>
      <stop offset="85%" stop-color="#FFF3BF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Filters for Radiant Glow -->
    <filter id="solarGlowHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" result="blur1"/>
      <feGaussianBlur stdDeviation="76" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="solarGlowMid" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="solarGlowCrisp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- iOS Squircle Shape Clip (Standard 1024x1024 with r=224) -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Deep Obsidian Black Background -->
    <rect width="1024" height="1024" fill="url(#obsidianBg)"/>

    <!-- Subtle Fiery Perimeter Rim Lighting -->
    <rect x="2" y="2" width="1020" height="1020" rx="222" ry="222" fill="none" stroke="url(#fieryRim)" stroke-width="4" opacity="0.85"/>

    <!-- Center Atmospheric Solar Backlight -->
    <circle cx="512" cy="526" r="420" fill="url(#solarAmbientGlow)"/>

    <!-- Specular Dome Crest at Top Rim -->
    <path d="M 220 12 C 340 32, 684 32, 804 12 C 670 20, 354 20, 220 12 Z" fill="#FFA502" opacity="0.12"/>

    <!-- ========================================================
         CIRCULAR CALIBRATED CALORIE PROGRESS RING & TELEMETRY DIAL
         Dial Center = (512, 512), Main Arc Radius = 340
         ======================================================== -->
    <!-- Outer Ambient Dial Bezel Ring -->
    <circle cx="512" cy="512" r="386" fill="none" stroke="#25161C" stroke-width="2.5" opacity="0.6"/>
    <circle cx="512" cy="512" r="376" fill="none" stroke="#3D1A22" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45"/>

    <!-- Background Recessed Track (r=340, width=28) -->
    <circle cx="512" cy="512" r="340" fill="none" stroke="#1C141E" stroke-width="30" opacity="0.8"/>
    <circle cx="512" cy="512" r="340" fill="none" stroke="#2B1824" stroke-width="18" opacity="0.5"/>

    <!-- ========================================================
         PRECISION CALIBRATION TICK MARKS (Calorie Measurement Units)
         ======================================================== -->
    <g stroke-linecap="round">
      <!-- Minor Sub-ticks (every 10 degrees) -->
      <g stroke="#3D2430" stroke-width="2.5" opacity="0.75">
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(10 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(20 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(40 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(50 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(70 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(80 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(100 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(110 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(130 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(140 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(160 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(170 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(190 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(200 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(220 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(230 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(250 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(260 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(280 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(290 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(310 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(320 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(340 512 512)"/>
        <line x1="512" y1="138" x2="512" y2="150" transform="rotate(350 512 512)"/>
      </g>

      <!-- Major 30-degree Calibration Bars with Solar Heat Gradient Shading -->
      <!-- Top Molten Gold Zone (300° to 60°) -->
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FFA502" stroke-width="4.5" opacity="0.95"/>
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FFA502" stroke-width="4" opacity="0.9" transform="rotate(30 512 512)"/>
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FF921E" stroke-width="4" opacity="0.9" transform="rotate(60 512 512)"/>
      <!-- Right Solar Tangerine Zone (90° to 150°) -->
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FF7F50" stroke-width="4.5" opacity="0.95" transform="rotate(90 512 512)"/>
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FF7F50" stroke-width="4" opacity="0.9" transform="rotate(120 512 512)"/>
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FF6347" stroke-width="4" opacity="0.9" transform="rotate(150 512 512)"/>
      <!-- Bottom/Left Fiery Coral Red Zone (180° to 270°) -->
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FF4757" stroke-width="4.5" opacity="0.95" transform="rotate(180 512 512)"/>
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FF4757" stroke-width="4" opacity="0.9" transform="rotate(210 512 512)"/>
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FF4757" stroke-width="4" opacity="0.85" transform="rotate(240 512 512)"/>
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FF6B6B" stroke-width="4" opacity="0.85" transform="rotate(270 512 512)"/>
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FFA502" stroke-width="4" opacity="0.9" transform="rotate(300 512 512)"/>
      <line x1="512" y1="132" x2="512" y2="156" stroke="#FFA502" stroke-width="4" opacity="0.9" transform="rotate(330 512 512)"/>
    </g>

    <!-- ========================================================
         GLOWING ACTIVE CALORIE BURN PROGRESS RING
         Circumference at r=340: 2 * PI * 340 ≈ 2136.28
         Active progress arc: ~82% of perimeter ≈ 1750 px
         ======================================================== -->
    <!-- Heavy Ambient Plasma Halo on Progress Ring -->
    <circle cx="512" cy="512" r="340" fill="none" stroke="url(#solarRingGrad)" stroke-width="32"
            stroke-linecap="round" stroke-dasharray="1720 2137" transform="rotate(-215 512 512)"
            filter="url(#solarGlowHeavy)" opacity="0.7"/>

    <!-- Primary Radiant Progress Arc -->
    <circle cx="512" cy="512" r="340" fill="none" stroke="url(#solarRingGrad)" stroke-width="22"
            stroke-linecap="round" stroke-dasharray="1720 2137" transform="rotate(-215 512 512)"/>

    <!-- High-Luminance Specular Core Wire -->
    <circle cx="512" cy="512" r="340" fill="none" stroke="#FFF3BF" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="1620 2137" transform="rotate(-210 512 512)" opacity="0.8"/>

    <!-- Active Leading Progress Energy Node (Golden Amber Head Pip) -->
    <g transform="rotate(74 512 512)">
      <circle cx="512" cy="172" r="16" fill="#FFA502" filter="url(#solarGlowMid)"/>
      <circle cx="512" cy="172" r="9" fill="#FFF3BF"/>
      <circle cx="512" cy="172" r="4.5" fill="#FFFFFF"/>
    </g>

    <!-- Progress Ring Origin Pip (Fiery Coral Anchor) -->
    <g transform="rotate(-215 512 512)">
      <circle cx="512" cy="172" r="11" fill="#FF4757" filter="url(#solarGlowCrisp)"/>
      <circle cx="512" cy="172" r="5" fill="#FFEAA7"/>
    </g>

    <!-- Inner Secondary Telemetry Orbit Ring (r=265) -->
    <circle cx="512" cy="512" r="265" fill="none" stroke="#3D2028" stroke-width="2" stroke-dasharray="6 12" opacity="0.6"/>
    <circle cx="512" cy="512" r="200" fill="none" stroke="#2A151C" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45"/>

    <!-- Orbiting Calorie Telemetry Sparks -->
    <circle cx="270" cy="420" r="4" fill="#FF4757" filter="url(#solarGlowCrisp)"/>
    <circle cx="754" cy="420" r="4" fill="#FFA502" filter="url(#solarGlowCrisp)"/>
    <circle cx="320" cy="630" r="3.5" fill="#FF7F50" filter="url(#solarGlowCrisp)"/>
    <circle cx="704" cy="630" r="3.5" fill="#FFA502" filter="url(#solarGlowCrisp)"/>

    <!-- Top Apex Zero-Balance Calibration Notches -->
    <g transform="translate(512, 114)">
      <circle cx="0" cy="0" r="8" fill="#14141A" stroke="#FFA502" stroke-width="2.5" filter="url(#solarGlowCrisp)"/>
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
      <line x1="-15" y1="0" x2="-10" y2="0" stroke="#FF4757" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="0" x2="15" y2="0" stroke="#FFA502" stroke-width="2" stroke-linecap="round"/>
    </g>


    <!-- ========================================================
         HIGH-TECH GLOWING METABOLIC CALORIE BURN FLAME
         Center Anchor = (512, 535)
         Tiers: Outer Flame Body, Secondary Harmonic Plumes,
         Molten Gold Kinetic Core, and White-Hot Plasma Heart
         ======================================================== -->

    <!-- Deep Ambient Glow Behind Outer Flame Silhouette -->
    <path d="M 512 215 
             C 576 310, 680 415, 680 545 
             C 680 660, 605 735, 512 735 
             C 419 735, 344 660, 344 545 
             C 344 425, 435 340, 474 275 
             C 468 350, 520 395, 536 440 
             C 560 385, 545 285, 512 215 Z"
          fill="url(#flameOuterGrad)" filter="url(#solarGlowHeavy)" opacity="0.8"/>

    <!-- LAYER 1: OUTER HIGH-TECH FLAME BODY (Fiery Coral to Solar Tangerine) -->
    <path d="M 512 230 
             C 572 320, 670 422, 670 545 
             C 670 652, 600 725, 512 725 
             C 424 725, 354 652, 354 545 
             C 354 430, 440 348, 474 288 
             C 468 360, 518 402, 534 445 
             C 556 392, 542 300, 512 230 Z"
          fill="url(#flameOuterGrad)" filter="url(#solarGlowMid)"/>

    <!-- LAYER 2: INTERIOR ASCENDING SOLAR TANGERINE WING PLUMES -->
    <!-- Left Ascending Crest -->
    <path d="M 512 300 
             C 460 380, 400 460, 400 550 
             C 400 640, 452 695, 512 705 
             C 470 655, 450 595, 465 520 
             C 475 470, 502 430, 512 385 Z"
          fill="url(#flameMidGrad)" opacity="0.9" filter="url(#solarGlowCrisp)"/>

    <!-- Right Ascending Crest -->
    <path d="M 512 280 
             C 560 365, 624 450, 624 545 
             C 624 635, 574 695, 512 705 
             C 554 655, 574 595, 558 520 
             C 548 468, 520 425, 512 380 Z"
          fill="url(#flameMidGrad)" opacity="0.9" filter="url(#solarGlowCrisp)"/>

    <!-- Central Rising Flame Body -->
    <path d="M 512 320 
             C 550 395, 615 475, 615 560 
             C 615 640, 570 695, 512 695 
             C 454 695, 409 640, 409 560 
             C 409 480, 465 415, 488 365 
             C 484 415, 520 450, 530 485 
             C 546 445, 536 375, 512 320 Z"
          fill="url(#flameMidGrad)" filter="url(#solarGlowMid)"/>

    <!-- LAYER 3: MOLTEN GOLD KINETIC CORE TIER -->
    <path d="M 512 400 
             C 542 460, 580 518, 580 585 
             C 580 642, 550 675, 512 675 
             C 474 675, 444 642, 444 585 
             C 444 525, 478 472, 494 435 
             C 494 470, 516 492, 522 518 
             C 536 488, 528 440, 512 400 Z"
          fill="url(#flameCoreGrad)" filter="url(#solarGlowCrisp)"/>

    <!-- LAYER 4: INTENSE WHITE-HOT / MOLTEN PLASMA APERTURE HEART -->
    <path d="M 512 485 
             C 528 528, 550 564, 550 608 
             C 550 645, 534 664, 512 664 
             C 490 664, 474 645, 474 608 
             C 474 570, 494 535, 502 508 
             C 504 530, 516 545, 520 560 
             C 528 540, 522 510, 512 485 Z"
          fill="#FFFFFF" filter="url(#solarGlowCrisp)"/>

    <!-- Central Pure White Spark Lens -->
    <ellipse cx="512" cy="612" rx="18" ry="28" fill="#FFFFFF" filter="url(#solarGlowCrisp)"/>

    <!-- Dynamic Metabolic Calorie Sparks (Floating Thermal Energy Particles) -->
    <circle cx="432" cy="455" r="4.5" fill="#FFA502" filter="url(#solarGlowCrisp)"/>
    <circle cx="432" cy="455" r="2" fill="#FFFFFF"/>

    <circle cx="594" cy="470" r="4.5" fill="#FF7F50" filter="url(#solarGlowCrisp)"/>
    <circle cx="594" cy="470" r="2" fill="#FFFFFF"/>

    <circle cx="578" cy="370" r="4" fill="#FFA502" filter="url(#solarGlowCrisp)"/>
    <circle cx="448" cy="360" r="3.5" fill="#FF4757" opacity="0.9" filter="url(#solarGlowCrisp)"/>

    <circle cx="512" cy="195" r="3" fill="#FFF3BF" filter="url(#solarGlowCrisp)"/>
    <circle cx="512" cy="755" r="3" fill="#FF4757" opacity="0.8"/>
  </g>
</svg>