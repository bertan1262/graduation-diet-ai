version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: diet_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: diet_ai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diet_ai_backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/diet_ai_db
      AI_SERVICE_URL: http://ai-service:8001
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: diet_ai_ai_service
    restart: on-failure
    environment:
      PORT: 8001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key}
    ports:
      - "8001:8001"

volumes:
  pgdata:
